<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>Dice Game</nav>

    <!-- Players -->
    <div class="content">
        <div class="user1">
            <h3>Player - 1</h3>
            <input id="Player1" type="text" placeholder="Enter your name" aria-label="Player 1 name">
            <img src="./image/image1.png" alt="Player 1 dice">
        </div>

        <h1>Vs</h1>

        <div class="user2">
            <h3>Player - 2</h3>
            <input id="Player2" type="text" placeholder="Enter your name" aria-label="Player 2 name">
            <img src="./image/image2.png" alt="Player 2 dice">
        </div>
    </div>

    <!-- Result sentence -->
    <h2 id="tag" aria-live="polite"></h2>

    <!-- Roll button -->
    <div class="rollbtn">
        <button onclick="submit()">Press to Spin</button>
    </div>

    <script src="logic.js"></script>
</body>
</html>
